name: HeartSync Private Code Runner
run-name: "CI on [${{ inputs.private_branch || github.event.inputs.private_branch || github.event.inputs.branch || github.event.client_payload.branch || 'main' }}] by @${{ github.actor }}"

on:
  # Allows manual execution with custom parameters from the GitHub Actions UI
  workflow_dispatch:
    inputs:
      private_branch:
        description: 'Branch, Tag, or Commit SHA from private repo (priyaranjan-sahu/heartsync) to run'
        required: true
        type: string
        default: 'main'
      publish_release:
        description: 'Publish generated application bundles to Private Repo Releases'
        required: true
        type: boolean
        default: true
      upload_artifacts:
        description: 'Upload downloadable zip artifacts to this GitHub Actions run'
        required: true
        type: boolean
        default: true
      run_tests:
        description: 'Run backend unit and integration test suite'
        required: true
        type: boolean
        default: true
      build_web:
        description: 'Run React 19 / Vite production build validation'
        required: true
        type: boolean
        default: true
      build_android_apk:
        description: 'Compile Android Test APK (HeartSync-test.apk)'
        required: true
        type: boolean
        default: true
      test_docker:
        description: 'Validate Docker Compose service topologies'
        required: false
        type: boolean
        default: false

  # Triggered automatically via webhook dispatch from the private repository
  repository_dispatch:
    types: [run-ci, trigger-runner]

  # Optional daily health & regression verification
  schedule:
    - cron: '0 3 * * *' # Every day at 03:00 UTC

jobs:
  execute-private-pipeline:
    name: Run Pipeline for ${{ github.event.inputs.private_branch || github.event.inputs.branch || github.event.client_payload.branch || 'main' }}
    runs-on: ubuntu-latest
    timeout-minutes: 30

    services:
      postgres:
        image: postgis/postgis:16-3.4-alpine
        env:
          POSTGRES_DB: heartsync_test
          POSTGRES_USER: postgres
          POSTGRES_PASSWORD: heartsync_secure_test_password
        ports:
          - 5432:5432
        options: >-
          --health-cmd pg_isready
          --health-interval 5s
          --health-timeout 5s
          --health-retries 5

      redis:
        image: redis:7-alpine
        ports:
          - 6379:6379
        options: >-
          --health-cmd "redis-cli ping"
          --health-interval 5s
          --health-timeout 5s
          --health-retries 5

    steps:
      - name: Resolve Target Branch & Ref
        id: vars
        run: |
          TARGET="${{ github.event.inputs.private_branch }}"
          if [ -z "$TARGET" ]; then
            TARGET="${{ github.event.inputs.branch }}"
          fi
          if [ -z "$TARGET" ]; then
            TARGET="${{ github.event.client_payload.branch }}"
          fi
          if [ -z "$TARGET" ]; then
            TARGET="main"
          fi
          # Trim whitespace
          TARGET=$(echo "$TARGET" | xargs)
          echo "target_ref=$TARGET" >> $GITHUB_OUTPUT
          echo "Trigger Source: ${{ github.event_name }}"
          echo "Target Private Branch / Ref: $TARGET"

      - name: Validate Secrets Configuration
        run: |
          if [ -z "${{ secrets.PRIVATE_REPO_TOKEN }}" ]; then
            echo "::error::Missing secret 'PRIVATE_REPO_TOKEN'. Please ensure the GitHub Personal Access Token (PAT) is configured."
            exit 1
          fi

      - name: Checkout Target Branch from Private HeartSync Repo
        uses: actions/checkout@v4
        with:
          repository: 'priyaranjan-sahu/heartsync'
          token: ${{ secrets.PRIVATE_REPO_TOKEN }}
          ref: ${{ steps.vars.outputs.target_ref }}
          path: './workspace'
          fetch-depth: 5

      - name: Verify Checked-out Code & Commit Metadata
        id: commit
        working-directory: ./workspace
        run: |
          COMMIT_HASH=$(git rev-parse --short HEAD)
          COMMIT_FULL=$(git rev-parse HEAD)
          COMMIT_MSG=$(git log -1 --pretty=%B | head -n 1)
          COMMIT_AUTHOR=$(git log -1 --pretty="%an <%ae>")
          COMMIT_DATE=$(git log -1 --pretty=%cd --date=iso)

          echo "hash=$COMMIT_HASH" >> $GITHUB_OUTPUT
          echo "msg=$COMMIT_MSG" >> $GITHUB_OUTPUT
          echo "author=$COMMIT_AUTHOR" >> $GITHUB_OUTPUT

          echo "=================================================="
          echo " CHECKED OUT PRIVATE CODE METADATA"
          echo "=================================================="
          echo "Requested Ref: ${{ steps.vars.outputs.target_ref }}"
          echo "Commit SHA:    $COMMIT_HASH ($COMMIT_FULL)"
          echo "Commit Msg:    $COMMIT_MSG"
          echo "Author:        $COMMIT_AUTHOR"
          echo "Commit Date:   $COMMIT_DATE"
          echo "=================================================="

          # Output rich markdown summary to GitHub Actions UI
          echo "### 🚀 HeartSync Pipeline Execution Summary" >> $GITHUB_STEP_SUMMARY
          echo "| Parameter | Value |" >> $GITHUB_STEP_SUMMARY
          echo "| :--- | :--- |" >> $GITHUB_STEP_SUMMARY
          echo "| **Target Branch / Ref** | \`${{ steps.vars.outputs.target_ref }}\` |" >> $GITHUB_STEP_SUMMARY
          echo "| **Commit SHA** | \`$COMMIT_HASH\` |" >> $GITHUB_STEP_SUMMARY
          echo "| **Commit Message** | $COMMIT_MSG |" >> $GITHUB_STEP_SUMMARY
          echo "| **Author** | $COMMIT_AUTHOR |" >> $GITHUB_STEP_SUMMARY
          echo "| **Triggered By** | @${{ github.actor }} (${{ github.event_name }}) |" >> $GITHUB_STEP_SUMMARY

      - name: Setup Node.js Runtime
        uses: actions/setup-node@v4
        with:
          node-version: 20
          cache: 'npm'
          cache-dependency-path: './workspace/backend/package.json'

      - name: Install Backend Dependencies
        working-directory: ./workspace/backend
        run: |
          echo "Installing backend dependencies..."
          npm ci || npm install

      - name: Run Backend Automated Test Suite
        if: ${{ github.event_name != 'workflow_dispatch' || github.event.inputs.run_tests == 'true' }}
        working-directory: ./workspace/backend
        env:
          DATABASE_URL: postgres://postgres:heartsync_secure_test_password@localhost:5432/heartsync_test
          REDIS_URL: redis://localhost:6379
        run: |
          echo "Executing HeartSync database schema migration on PostgreSQL 16 + PostGIS..."
          node scripts/migrate_to_postgres.js
          echo "Executing HeartSync backend unit and integration tests..."
          npm test

      - name: Install Web Dependencies & Build Frontend
        if: ${{ github.event_name != 'workflow_dispatch' || github.event.inputs.build_web == 'true' }}
        working-directory: ./workspace/web
        run: |
          echo "Installing web frontend dependencies..."
          npm ci || npm install
          echo "Executing Vite production build..."
          npm run build

      - name: Setup Java Development Kit (JDK 17)
        if: ${{ github.event_name != 'workflow_dispatch' || github.event.inputs.build_android_apk != 'false' }}
        uses: actions/setup-java@v4
        with:
          distribution: 'temurin'
          java-version: '17'

      - name: Build Android Test APK
        if: ${{ github.event_name != 'workflow_dispatch' || github.event.inputs.build_android_apk != 'false' }}
        working-directory: ./workspace/mobile
        env:
          ANDROID_HOME: /usr/local/lib/android/sdk
        run: |
          echo "Installing mobile client dependencies..."
          npm install
          mkdir -p ../../artifacts

          echo "Accepting Android SDK licenses..."
          yes | $ANDROID_HOME/cmdline-tools/latest/bin/sdkmanager --licenses || true

          echo "Prebuilding native Android Gradle project via Expo..."
          npx expo prebuild --platform android --clean

          echo "Configuring Kotlin 1.9.25 in android/build.gradle..."
          cd android
          sed -i 's/kotlinVersion = .*/kotlinVersion = "1.9.25"/' build.gradle || true
          echo "android.suppressKotlinVersionCompatibilityCheck=true" >> gradle.properties

          echo "Compiling Standalone Android Test APK..."
          chmod +x gradlew
          ./gradlew assembleDebug --no-daemon -Pandroid.suppressKotlinVersionCompatibilityCheck=true

          echo "Locating and packaging generated APK..."
          find . -name "*.apk" -type f
          if [ -f "app/build/outputs/apk/debug/app-debug.apk" ]; then
            cp app/build/outputs/apk/debug/app-debug.apk ../../../artifacts/HeartSync-test.apk
            echo "✔ HeartSync-test.apk generated successfully."
          else
            echo "Searching for fallback apk path..."
            APK_FILE=$(find app/build/outputs/apk -name "*.apk" | head -n 1)
            if [ -n "$APK_FILE" ]; then
              cp "$APK_FILE" ../../../artifacts/HeartSync-test.apk
              echo "✔ HeartSync-test.apk found and copied."
            fi
          fi

      - name: Validate Docker Compose Configuration
        if: ${{ github.event.inputs.test_docker == 'true' }}
        working-directory: ./workspace
        run: |
          echo "Validating Docker Compose configuration..."
          docker compose config

      - name: Package Application Distribution Bundles
        if: ${{ github.event_name != 'workflow_dispatch' || github.event.inputs.build_web == 'true' }}
        run: |
          mkdir -p ./artifacts

          # 1. Package Web Client Production Build
          if [ -d "./workspace/web/dist" ]; then
            echo "Packaging Web distribution..."
            cd ./workspace/web/dist
            zip -r ../../../artifacts/heartsync-web-dist.zip ./*
            cd ../../../
          fi

          # 2. Package Backend Server Application Bundle
          if [ -d "./workspace/backend" ]; then
            echo "Packaging Backend Server bundle..."
            mkdir -p ./backend-bundle
            cp -r ./workspace/backend/src ./backend-bundle/
            cp ./workspace/backend/package.json ./backend-bundle/
            cp ./workspace/backend/package-lock.json ./backend-bundle/
            cp -r ./workspace/shared ./backend-bundle/ 2>/dev/null || true
            cp ./workspace/docker-compose.yml ./backend-bundle/ 2>/dev/null || true
            cd ./backend-bundle
            zip -r ../artifacts/heartsync-backend-bundle.zip ./*
            cd ../
            rm -rf ./backend-bundle
          fi

          echo "Generated Artifacts:"
          ls -la ./artifacts

      - name: Upload Web Build Artifact
        if: ${{ (github.event_name != 'workflow_dispatch' || github.event.inputs.upload_artifacts != 'false') && hashFiles('artifacts/heartsync-web-dist.zip') != '' }}
        uses: actions/upload-artifact@v4
        with:
          name: heartsync-web-dist
          path: ./artifacts/heartsync-web-dist.zip
          retention-days: 30

      - name: Upload Backend Bundle Artifact
        if: ${{ (github.event_name != 'workflow_dispatch' || github.event.inputs.upload_artifacts != 'false') && hashFiles('artifacts/heartsync-backend-bundle.zip') != '' }}
        uses: actions/upload-artifact@v4
        with:
          name: heartsync-backend-bundle
          path: ./artifacts/heartsync-backend-bundle.zip
          retention-days: 30

      - name: Upload Android Test APK Artifact
        if: ${{ (github.event_name != 'workflow_dispatch' || github.event.inputs.upload_artifacts != 'false') && hashFiles('artifacts/HeartSync-test.apk') != '' }}
        uses: actions/upload-artifact@v4
        with:
          name: HeartSync-test-apk
          path: ./artifacts/HeartSync-test.apk
          retention-days: 30

      - name: Publish Release to Private HeartSync Repository
        if: ${{ (github.event_name != 'workflow_dispatch' || github.event.inputs.publish_release != 'false') && (hashFiles('artifacts/heartsync-web-dist.zip') != '' || hashFiles('artifacts/heartsync-backend-bundle.zip') != '' || hashFiles('artifacts/HeartSync-test.apk') != '') }}
        env:
          GH_TOKEN: ${{ secrets.PRIVATE_REPO_TOKEN }}
        run: |
          RELEASE_TAG="build-${{ steps.vars.outputs.target_ref }}-$(date +'%Y%m%d-%H%M%S')"
          RELEASE_TITLE="HeartSync Build [${{ steps.vars.outputs.target_ref }}] - $(date +'%Y-%m-%d %H:%M UTC')"

          echo "Publishing release $RELEASE_TAG to private repository priyaranjan-sahu/heartsync..."

          FILES_TO_UPLOAD=()
          for f in ./artifacts/*.zip ./artifacts/*.apk; do
            if [ -f "$f" ]; then
              FILES_TO_UPLOAD+=("$f")
            fi
          done

          gh release create "$RELEASE_TAG" \
            "${FILES_TO_UPLOAD[@]}" \
            --repo priyaranjan-sahu/heartsync \
            --target "${{ steps.vars.outputs.target_ref }}" \
            --title "$RELEASE_TITLE" \
            --notes "### 🚀 Automated Build Deployment
          - **Target Branch / Ref:** \`${{ steps.vars.outputs.target_ref }}\`
          - **Commit SHA:** \`${{ steps.commit.outputs.hash }}\`
          - **Commit Message:** ${{ steps.commit.outputs.msg }}
          - **Author:** ${{ steps.commit.outputs.author }}
          - **Generated by:** Public Runner Bridge (@${{ github.actor }})

          #### Included Application Packages:
          - \`HeartSync-test.apk\`: Installable standalone Android APK for physical device testing
          - \`heartsync-web-dist.zip\`: Compiled Vite / React 19 production web client
          - \`heartsync-backend-bundle.zip\`: Production Express backend & domain services"

          echo "✔ Successfully published release to https://github.com/priyaranjan-sahu/heartsync/releases"

      - name: Ephemeral Workspace Cleanup
        if: always()
        run: |
          echo "Wiping private code and artifacts from runner disk..."
          rm -rf ./workspace ./artifacts
          echo "Cleanup complete. Zero private artifacts retained on runner."
